---
# =============================================================================
# Inventory TĨNH. Không sinh tự động nữa — bootstrap/sync-inventory.sh chỉ
# dùng được khi cluster chạy trên tailnet, mà giờ node định danh bằng IP LAN.
#
# Mỗi host khai hai địa chỉ (xem host_vars/):
#   lan_ip        192.168.0.x  — định danh node trong cluster, ĐÂY là node IP
#   tailscale_ip  100.80.0.x   — chỉ là đường quản trị từ xa
#
# Ansible đi đường nào là do ansible_transport_net (group_vars/all/network.yml):
#   ở nhà, cùng LAN:   ansible-playbook playbooks/site.yml
#   ở xa, qua tailnet: ansible-playbook playbooks/site.yml -e ansible_transport_net=tailscale
#
# Đổi đường đi KHÔNG đổi định danh node — cluster luôn dùng lan_ip.
# =============================================================================

all:
  children:
    masters:
      hosts:
        userver-master: {}
    workers:
      hosts:
        userver-worker-1: {}
        # Offline từ ~2026-08-18, không associate được Wi-Fi (đã xác minh bằng
        # ARP sweep + 75s bắt gói thụ động: không thấy MAC nào của nó).
        # Cần đến tận nơi mới cứu được — xem ../docs/runbook-worker-2.md.
        # Bỏ comment sau khi nó lên lại.
        # userver-worker-2: {}

    k8s_cluster:
      children:
        masters:
        workers:
