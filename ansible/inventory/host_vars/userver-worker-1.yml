---
# =============================================================================
# userver-worker-1
# =============================================================================

lan_ip: "192.168.0.12"                 # định danh node trong cluster (--node-ip)
tailscale_ip: "100.80.0.2"            # chỉ dùng để quản trị từ xa
node_role: "worker"

# Tham khảo — không có task nào đọc hai dòng dưới. Ghi lại vì MAC là thứ cần
# khi đặt DHCP reservation trên router, và tên interface Wi-Fi khác nhau giữa
# các máy nên đừng hardcode nó ở đâu cả.
wifi_mac: ""   # xem ~/dev/porfolio/STATUS.md — không để MAC trong repo public
wifi_iface: "wlo1"

# Cluster luôn dùng lan_ip, bất kể Ansible SSH vào bằng đường nào.
node_ip: "{{ lan_ip }}"
ansible_host: "{{ lan_ip if ansible_transport_net == 'lan' else tailscale_ip }}"
