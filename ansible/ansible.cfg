[defaults]
inventory         = inventory/hosts.yml
roles_path        = roles
remote_user       = johnnaeder
private_key_file  = ~/.ssh/id_ed25519
host_key_checking = False
retry_files_enabled = False
# community.general.yaml đã bị gỡ ở collection version 12.0; máy này đang
# 13.3. Cùng định dạng đó giờ nằm trong callback mặc định.
stdout_callback   = default
result_format     = yaml
timeout           = 30

# Không cấu hình vault_password_file. Chưa có secret nào Ansible cần: mọi
# credential đều thuộc tầng K8s (xem deploy/platform/*/secrets/). Một file
# vault mã hoá mà rỗng về nội dung vẫn chặn được toàn bộ playbook, vì Ansible
# phải giải mã được group_vars trước khi chạy task đầu tiên.
#
# Khi thật sự cần: tạo lại inventory/group_vars/all/vault.yml từ vault.yml.example,
# `make vault-encrypt`, rồi thêm lại dòng vault_password_file ở đây.

# Performance
forks             = 5
pipelining        = True

[privilege_escalation]
become            = True
become_method     = sudo
become_user       = root
become_ask_pass   = False

[ssh_connection]
ssh_args          = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
