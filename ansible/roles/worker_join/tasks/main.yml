---
# =============================================================================
# Role: worker_join
# Join worker node vào K8s cluster
# - Reset trước khi join (đảm bảo sạch)
# - Chạy kubeadm join
# - Patch kubelet node-ip sau join
# =============================================================================

# --- Reset state cũ ---
- name: Reset kubeadm state cũ (nếu có)
  ansible.builtin.command: >
    kubeadm reset -f --cri-socket unix:///run/containerd/containerd.sock
  register: kubeadm_reset
  changed_when: "'[reset] ' in kubeadm_reset.stdout"
  failed_when: false

- name: Xóa CNI config cũ
  ansible.builtin.file:
    path: /etc/cni/net.d
    state: absent

- name: Dọn iptables chains của kube/CNI (giữ nguyên ts-* của Tailscale và ufw-*)
  ansible.builtin.shell: |
    set -u
    PFX='^(cali-|CALI-|KUBE-|CILIUM_|DOCKER)'
    # Xoá theo SỐ THỨ TỰ rule, không dựng lại rule-spec.
    #
    # Cách cũ (`iptables -S | sed 's/^-A /-D /'` rồi đưa vào shell) trượt im
    # lặng: rule của Calico mang `--comment "cali:Cz_u1IQiXIMmKD4c"`, và dấu
    # nháy trong đó thành ký tự thật khi khai triển không quote, nên iptables
    # không khớp được rule nào. Chain vì thế vẫn bị tham chiếu và -X báo
    # "Device or resource busy" — cũng bị nuốt luôn.
    #
    # Phải gỡ rule THAM CHIẾU trước rồi mới xoá được chain, nên có nhiều vòng.
    for pass in 1 2 3 4; do
      for t in filter nat mangle raw; do
        for chain in $(iptables -t "$t" -L -n 2>/dev/null | awk '/^Chain /{print $2}'); do
          iptables -t "$t" -L "$chain" --line-numbers -n 2>/dev/null \
            | awk -v p="$PFX" '/^[0-9]/ && $2 ~ p {print $1}' \
            | sort -rn \
            | while read -r n; do iptables -t "$t" -D "$chain" "$n" 2>/dev/null; done
        done
        for c in $(iptables -t "$t" -S 2>/dev/null \
                   | awk -v p="^-N (cali-|CALI-|KUBE-|CILIUM_|DOCKER)" '$0 ~ p {print $2}'); do
          iptables -t "$t" -F "$c" 2>/dev/null
          iptables -t "$t" -X "$c" 2>/dev/null
        done
      done
      [ "$(iptables-save | grep -cE '^:(cali-|CALI-|KUBE-|CILIUM_|DOCKER)')" -eq 0 ] && break
    done
    echo "remaining=$(iptables-save | grep -cE '^:(cali-|CALI-|KUBE-|CILIUM_|DOCKER)')"
  register: ipt_clean
  changed_when: false
  failed_when: "'remaining=0' not in ipt_clean.stdout"
- name: Cấu hình kubelet defaults
  ansible.builtin.copy:
    content: 'KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}'
    dest: /etc/default/kubelet
    mode: "0644"

# --- Join cluster ---
- name: Verify inventory có group masters
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length > 0
    fail_msg: "Inventory thiếu group 'masters' hoặc group rỗng; không thể lấy join command."

- name: Lấy join command từ master
  ansible.builtin.set_fact:
    join_command: "{{ hostvars[groups['masters'][0]].k8s_join_command | default('') }}"

- name: Tạo join command mới từ master nếu chưa có fact
  ansible.builtin.command: kubeadm token create --print-join-command
  delegate_to: "{{ groups['masters'][0] }}"
  register: join_command_fallback
  changed_when: false
  when: join_command | length == 0

- name: Dùng join command fallback
  ansible.builtin.set_fact:
    join_command: "{{ join_command_fallback.stdout }}"
  when: join_command | length == 0

- name: Verify join command hợp lệ
  ansible.builtin.assert:
    that:
      - join_command is defined
      - join_command | length > 0
      - join_command is match('^kubeadm\\s+join\\s+')
    fail_msg: "Không lấy được kubeadm join command hợp lệ từ master."

- name: Hiển thị join command
  ansible.builtin.debug:
    msg: "Joining cluster: {{ join_command }}"

- name: Join cluster
  ansible.builtin.command: >
    {{ join_command }} --node-name {{ inventory_hostname }}
  register: join_result
  changed_when: true

- name: Hiển thị join result
  ansible.builtin.debug:
    var: join_result.stdout_lines

# --- Post-join: Patch kubelet node-ip ---
- name: Đợi kubeadm-flags.env được tạo
  ansible.builtin.wait_for:
    path: /var/lib/kubelet/kubeadm-flags.env
    timeout: 30

- name: Kiểm tra --node-ip trong kubeadm-flags.env
  ansible.builtin.command: grep -q "node-ip" /var/lib/kubelet/kubeadm-flags.env
  register: nodeip_check
  changed_when: false
  failed_when: false

- name: Patch --node-ip vào kubeadm-flags.env
  ansible.builtin.lineinfile:
    path: /var/lib/kubelet/kubeadm-flags.env
    regexp: '^(KUBELET_KUBEADM_ARGS=.*)"$'
    line: '\1 --node-ip={{ node_ip }}"'
    backrefs: true
  when: nodeip_check.rc != 0
  notify: Restart kubelet after join

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true

- name: Đợi kubelet ổn định
  ansible.builtin.pause:
    seconds: 10

# --- Verify ---
- name: Kiểm tra kubelet status
  ansible.builtin.systemd:
    name: kubelet
  register: kubelet_status

- name: Hiển thị kết quả
  ansible.builtin.debug:
    msg: |
      ═══════════════════════════════════════════
       Worker {{ inventory_hostname }} đã join cluster!
       Node IP: {{ node_ip }}
       kubelet: {{ kubelet_status.status.ActiveState }}

       Trên master, kiểm tra:
         kubectl get nodes -o wide
      ═══════════════════════════════════════════
