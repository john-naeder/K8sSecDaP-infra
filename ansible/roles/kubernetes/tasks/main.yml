---
# =============================================================================
# Role: kubernetes
# Cài đặt kubeadm, kubelet, kubectl + cấu hình kubelet Tailscale IP
# =============================================================================

- name: Cài packages cần thiết cho K8s repo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gpg
    state: present

- name: Tạo thư mục keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes GPG key
  ansible.builtin.shell: |
    curl -fsSL "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key" \
      | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Thêm Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /
    state: present
    filename: kubernetes

- name: Cài đặt kubeadm, kubelet, kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Hold K8s packages (tránh tự upgrade)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Cấu hình kubelet defaults với node-ip
  ansible.builtin.template:
    src: kubelet-defaults.j2
    dest: /etc/default/kubelet
    owner: root
    group: root
    mode: "0644"
  notify: Restart kubelet

- name: Tạo thư mục kubelet systemd override
  ansible.builtin.file:
    path: /etc/systemd/system/kubelet.service.d
    state: directory
    mode: "0755"

- name: Cấu hình kubelet node-ip (systemd drop-in)
  ansible.builtin.template:
    src: 20-node-ip.conf.j2
    dest: /etc/systemd/system/kubelet.service.d/20-node-ip.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart kubelet

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true

# --- Giữ chỗ cho hệ thống -------------------------------------------------
# Sửa thẳng /var/lib/kubelet/config.yaml thay vì dùng cờ --kube-reserved:
# các cờ đó đã deprecated từ lâu và sẽ bị gỡ.
#
# LƯU Ý: `kubeadm upgrade node` sinh lại file này từ ConfigMap kubelet-config
# trong kube-system, nên sau mỗi lần upgrade phải chạy lại role này.
- name: Đọc KubeletConfiguration hiện tại
  ansible.builtin.slurp:
    src: /var/lib/kubelet/config.yaml
  register: kubelet_cfg_raw
  failed_when: false

- name: Ghi reserved/eviction vào KubeletConfiguration
  ansible.builtin.copy:
    dest: /var/lib/kubelet/config.yaml
    content: "{{ merged | to_nice_yaml(indent=2) }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    current: "{{ kubelet_cfg_raw.content | b64decode | from_yaml }}"
    merged: >-
      {{ current | combine({
        'kubeReserved':   {'cpu': kubelet_kube_reserved_cpu,   'memory': kubelet_kube_reserved_memory},
        'systemReserved': {'cpu': kubelet_system_reserved_cpu, 'memory': kubelet_system_reserved_memory},
        'evictionHard':   {'memory.available': kubelet_eviction_memory, 'nodefs.available': '10%'},
      }, recursive=True) }}
  when: kubelet_cfg_raw.content is defined
  notify: Restart kubelet
