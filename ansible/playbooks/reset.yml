---
# =============================================================================
# reset.yml — Reset K8s trên node (kubeadm reset)
#
# Reset tất cả:
#   ansible-playbook playbooks/reset.yml
#
# Reset một node:
#   ansible-playbook playbooks/reset.yml --limit userver-worker-1
#
# Reset chỉ workers:
#   ansible-playbook playbooks/reset.yml --limit workers
#
# CẢNH BÁO: Sẽ xóa toàn bộ cấu hình K8s trên node!
# =============================================================================

- name: "Reset K8s nodes"
  hosts: k8s_cluster
  become: true
  tasks:
    - name: "⚠ Reset kubeadm"
      ansible.builtin.command: >
        kubeadm reset -f --cri-socket unix:///run/containerd/containerd.sock
      register: reset_result
      changed_when: true
      failed_when: false

    - name: Xóa CNI config
      ansible.builtin.file:
        path: /etc/cni/net.d
        state: absent

    - name: Xóa Cilium runtime artifacts
      # kubeadm reset không biết gì về eBPF. Bỏ sót /sys/fs/bpf/tc/globals thì
      # lần cài lại Cilium sẽ nạp đè lên map cũ và endpoint ma vẫn còn đó.
      ansible.builtin.shell: |
        for dev in cilium_host cilium_net cilium_vxlan cilium_geneve; do
          ip link delete "$dev" 2>/dev/null || true
        done
        rm -rf /sys/fs/bpf/tc/globals/cilium_* 2>/dev/null || true
        rm -rf /var/run/cilium /var/lib/cilium
        rm -f /etc/cni/net.d/05-cilium.conf /etc/cni/net.d/05-cilium.conflist
      changed_when: false
      failed_when: false

    - name: Dọn iptables chains của kube/CNI (giữ nguyên ts-* của Tailscale và ufw-*)
      ansible.builtin.shell: |
        set -u
        PFX='^(cali-|CALI-|KUBE-|CILIUM_|DOCKER)'
        # Xoá theo SỐ THỨ TỰ rule, không dựng lại rule-spec.
        #
        # Cách cũ (`iptables -S | sed 's/^-A /-D /'` rồi đưa vào shell) trượt im
        # lặng: rule của Calico mang `--comment "cali:Cz_u1IQiXIMmKD4c"`, và dấu
        # nháy trong đó thành ký tự thật khi khai triển không quote, nên iptables
        # không khớp được rule nào. Chain vì thế vẫn bị tham chiếu và -X báo
        # "Device or resource busy" — cũng bị nuốt luôn.
        #
        # Phải gỡ rule THAM CHIẾU trước rồi mới xoá được chain, nên có nhiều vòng.
        for pass in 1 2 3 4; do
          for t in filter nat mangle raw; do
            for chain in $(iptables -t "$t" -L -n 2>/dev/null | awk '/^Chain /{print $2}'); do
              iptables -t "$t" -L "$chain" --line-numbers -n 2>/dev/null \
                | awk -v p="$PFX" '/^[0-9]/ && $2 ~ p {print $1}' \
                | sort -rn \
                | while read -r n; do iptables -t "$t" -D "$chain" "$n" 2>/dev/null; done
            done
            for c in $(iptables -t "$t" -S 2>/dev/null \
                       | awk -v p="^-N (cali-|CALI-|KUBE-|CILIUM_|DOCKER)" '$0 ~ p {print $2}'); do
              iptables -t "$t" -F "$c" 2>/dev/null
              iptables -t "$t" -X "$c" 2>/dev/null
            done
          done
          [ "$(iptables-save | grep -cE '^:(cali-|CALI-|KUBE-|CILIUM_|DOCKER)')" -eq 0 ] && break
        done
        echo "remaining=$(iptables-save | grep -cE '^:(cali-|CALI-|KUBE-|CILIUM_|DOCKER)')"
      register: ipt_clean
      changed_when: false
      failed_when: "'remaining=0' not in ipt_clean.stdout"
    - name: Xóa kubeconfig (chỉ master)
      ansible.builtin.file:
        path: "/home/{{ k8s_admin_user | default('johnnaeder') }}/.kube/config"
        state: absent
      when: "'masters' in group_names"

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: true
      failed_when: false

    - name: Thông báo
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: K8s đã reset. Có thể chạy lại master.yml/worker.yml để re-init."
